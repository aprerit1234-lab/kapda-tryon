<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>अपने ऊपर कपड़ा देखें</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f7f4ef;
  font-family:Arial,sans-serif;
  color:#222;
}

.container{
  max-width:430px;
  margin:auto;
  padding:20px 15px 35px;
}

.header{text-align:center;padding:10px 0 20px}
.logo{font-size:45px}
h1{font-size:25px;margin:5px 0}
.subtitle{color:#666}

.card{
  background:white;
  border:1px solid #ddd;
  border-radius:20px;
  padding:18px;
  margin-top:15px;
}

.step{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.upload{
  display:block;
  text-align:center;
  border:2px dashed #aaa;
  border-radius:15px;
  padding:20px;
}

.upload input{
  display:block;
  width:100%;
  margin-top:12px;
}

.preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin-top:12px;
  border-radius:15px;
}

/* CLOTH BUTTONS */

.garments{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.garment{
  min-height:100px;
  width:100%;
  border:2px solid #ccc;
  border-radius:15px;
  background:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.garment:active{
  transform:scale(.96);
}

.garment.selected{
  border:4px solid #222;
  background:#eee;
}

.icon{
  font-size:32px;
  margin-bottom:5px;
}

#selected{
  text-align:center;
  color:#555;
  margin-top:12px;
  min-height:20px;
}

.main-button{
  width:100%;
  border:0;
  border-radius:15px;
  background:#222;
  color:white;
  padding:17px;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
  touch-action:manipulation;
}

.main-button:disabled{
  opacity:.45;
}

#status{
  text-align:center;
  margin-top:12px;
  color:#666;
}

#result{
  display:none;
}

#result img{
  width:100%;
  border-radius:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">👗</div>
  <h1>अपने ऊपर कपड़ा देखें</h1>
  <div class="subtitle">
    अपनी फोटो लें और पसंद का कपड़ा देखें
  </div>
</div>


<!-- PHOTO -->

<div class="card">

<div class="step">
1. अपनी फोटो 📷
</div>

<label class="upload">

<b>📷 फोटो लें / चुनें</b>

<input
  id="photo"
  type="file"
  accept="image/*"
  capture="user"
>

<img
  id="photoPreview"
  class="preview"
>

</label>

</div>


<!-- CLOTH -->

<div class="card">

<div class="step">
2. कपड़ा चुनें 👗
</div>

<div class="garments">

<button type="button"
class="garment"
data-cloth="Suit 1">

<div class="icon">🌸</div>
Suit 1

</button>

<button type="button"
class="garment"
data-cloth="Suit 2">

<div class="icon">💙</div>
Suit 2

</button>

<button type="button"
class="garment"
data-cloth="Blouse">

<div class="icon">❤️</div>
Blouse

</button>

</div>

<div id="selected">
कोई कपड़ा नहीं चुना
</div>

</div>


<!-- TRY -->

<div class="card">

<div class="step">
3. तैयार? ✨
</div>

<button
type="button"
id="tryButton"
class="main-button"
disabled>

✨ अपने ऊपर देखें

</button>

<div id="status"></div>

</div>


<!-- RESULT -->

<div
id="result"
class="card">

<div class="step">
आपका Preview ✨
</div>

<img id="resultImage">

</div>


<p style="text-align:center;color:#777;font-size:12px">
AI preview केवल अंदाज़े के लिए है।
</p>

</div>


<script>

let selectedCloth = null;

const photo =
document.getElementById("photo");

const preview =
document.getElementById("photoPreview");

const tryButton =
document.getElementById("tryButton");

const selected =
document.getElementById("selected");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const resultImage =
document.getElementById("resultImage");


// PHOTO

photo.addEventListener("change", function(){

  if(!this.files || !this.files[0]){
    return;
  }

  preview.src =
    URL.createObjectURL(this.files[0]);

  preview.style.display =
    "block";

  status.innerText =
    "फोटो मिल गई ✅";

  checkReady();

});


// CLOTH BUTTONS

document.querySelectorAll(".garment")
.forEach(function(button){

  button.addEventListener("click", function(){

    // remove old selection

    document.querySelectorAll(".garment")
    .forEach(function(b){
      b.classList.remove("selected");
    });

    // select clicked cloth

    button.classList.add("selected");

    selectedCloth =
      button.getAttribute("data-cloth");

    selected.innerText =
      "चुना गया: " + selectedCloth + " ✅";

    status.innerText =
      "कपड़ा चुन लिया ✅";

    checkReady();

  });

});


// ENABLE TRY BUTTON

function checkReady(){

  if(
    photo.files.length > 0 &&
    selectedCloth !== null
  ){

    tryButton.disabled = false;

  }

}


// TRY BUTTON

tryButton.addEventListener("click", function(){

  status.innerText =
    "⏳ Preview तैयार हो रहा है...";

  setTimeout(function(){

    /*
      अभी DEMO:
      असली AI Virtual Try-On
      बाद में यहां connect करेंगे.
    */

    resultImage.src =
      preview.src;

    result.style.display =
      "block";

    status.innerText =
      "✅ " + selectedCloth +
      " select हो गया";

    result.scrollIntoView({
      behavior:"smooth"
    });

  },700);

});

</script>

</body>
</html>
