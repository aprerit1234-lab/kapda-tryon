<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>अपने ऊपर कपड़ा देखें</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f4ef;
  color:#222;
  font-family:Arial,sans-serif;
}

.container{
  max-width:430px;
  margin:auto;
  padding:20px 15px 35px;
}

.header{
  text-align:center;
  padding:10px 0 20px;
}

.logo{
  font-size:45px;
}

h1{
  font-size:25px;
  margin:5px 0;
}

.subtitle{
  color:#666;
  font-size:15px;
}

.card{
  background:white;
  border:1px solid #ddd;
  border-radius:20px;
  padding:18px;
  margin-top:15px;
}

.step{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

/* CAMERA BUTTON */

.camera-button{
  display:block;
  width:100%;
  padding:20px 15px;
  border:2px dashed #aaa;
  border-radius:16px;
  background:#fcfbf9;
  text-align:center;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

.camera-button input{
  display:none;
}

.preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin-top:12px;
  border-radius:15px;
}

.done{
  display:none;
  text-align:center;
  color:#555;
  margin-top:10px;
  font-size:14px;
}

.main-button{
  width:100%;
  border:0;
  border-radius:16px;
  background:#222;
  color:white;
  padding:17px;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
  touch-action:manipulation;
}

.main-button:disabled{
  opacity:.45;
}

#status{
  text-align:center;
  color:#666;
  margin-top:12px;
  min-height:22px;
}

#result{
  display:none;
}

#result img{
  width:100%;
  border-radius:15px;
}

.note{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:18px;
}
</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

  <div class="logo">👗</div>

  <h1>
    अपने ऊपर कपड़ा देखें
  </h1>

  <div class="subtitle">
    अपनी फोटो और कपड़े की फोटो लें
  </div>

</div>


<!-- PERSON PHOTO -->

<div class="card">

  <div class="step">
    1. अपनी फोटो लें 📷
  </div>

  <label class="camera-button">

    📷 कैमरा खोलें और अपनी फोटो लें

    <input
      id="personPhoto"
      type="file"
      accept="image/*"
      capture="environment"
    >

  </label>

  <img
    id="personPreview"
    class="preview"
  >

  <div
    id="personDone"
    class="done"
  >
    आपकी फोटो तैयार है ✅
  </div>

</div>


<!-- CLOTH PHOTO -->

<div class="card">

  <div class="step">
    2. कपड़े की फोटो लें 👗
  </div>

  <label class="camera-button">

    👗 कैमरा खोलें और कपड़े की फोटो लें

    <input
      id="clothPhoto"
      type="file"
      accept="image/*"
      capture="environment"
    >

  </label>

  <img
    id="clothPreview"
    class="preview"
  >

  <div
    id="clothDone"
    class="done"
  >
    कपड़े की फोटो तैयार है ✅
  </div>

  <p
    style="font-size:13px;color:#777"
  >
    कपड़ा सीधा रखें और पूरी डिजाइन फोटो में दिखाएं।
  </p>

</div>


<!-- TRY ON -->

<div class="card">

  <div class="step">
    3. तैयार? ✨
  </div>

  <button
    id="tryButton"
    class="main-button"
    disabled
  >
    ✨ अपने ऊपर देखें
  </button>

  <div id="status"></div>

</div>


<!-- RESULT -->

<div
  id="result"
  class="card"
>

  <div class="step">
    आपका Preview ✨
  </div>

  <img
    id="resultImage"
  >

</div>


<div class="note">

  AI preview केवल अंदाज़े के लिए है।
  असली फिटिंग अलग हो सकती है।

</div>


</div>


<script>

const personPhoto =
document.getElementById("personPhoto");

const clothPhoto =
document.getElementById("clothPhoto");

const personPreview =
document.getElementById("personPreview");

const clothPreview =
document.getElementById("clothPreview");

const personDone =
document.getElementById("personDone");

const clothDone =
document.getElementById("clothDone");

const tryButton =
document.getElementById("tryButton");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const resultImage =
document.getElementById("resultImage");


// PERSON PHOTO

personPhoto.addEventListener(
  "change",
  function(){

    const file =
    this.files[0];

    if(!file){
      return;
    }

    personPreview.src =
    URL.createObjectURL(file);

    personPreview.style.display =
    "block";

    personDone.style.display =
    "block";

    status.innerText =
    "आपकी फोटो मिल गई ✅";

    checkReady();

  }
);


// CLOTH PHOTO

clothPhoto.addEventListener(
  "change",
  function(){

    const file =
    this.files[0];

    if(!file){
      return;
    }

    clothPreview.src =
    URL.createObjectURL(file);

    clothPreview.style.display =
    "block";

    clothDone.style.display =
    "block";

    status.innerText =
    "कपड़े की फोटो मिल गई ✅";

    checkReady();

  }
);


// CHECK BOTH PHOTOS

function checkReady(){

  if(
    personPhoto.files.length > 0 &&
    clothPhoto.files.length > 0
  ){

    tryButton.disabled =
    false;

    status.innerText =
    "दोनों फोटो तैयार हैं ✅ अब अपने ऊपर देखें दबाएं।";

  }

}


// TRY BUTTON

tryButton.addEventListener(
  "click",
  function(){

    status.innerText =
    "⏳ AI preview तैयार हो रहा है...";

    setTimeout(
      function(){

        /*
          अभी DEMO है।

          अगले चरण में:
          personPhoto + clothPhoto
          को REAL AI Virtual Try-On
          API में भेजेंगे।
        */

        resultImage.src =
        personPreview.src;

        result.style.display =
        "block";

        status.innerText =
        "✅ Demo preview तैयार है";

        result.scrollIntoView({
          behavior:"smooth"
        });

      },
      700
    );

  }
);

</script>

</body>
</html>
