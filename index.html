<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>अपने ऊपर कपड़ा देखें</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f4ef;
  font-family:Arial,sans-serif;
  color:#222;
}

.container{
  max-width:430px;
  margin:auto;
  padding:20px 15px 35px;
}

.header{
  text-align:center;
  padding:10px 0 20px;
}

.logo{
  font-size:45px;
}

h1{
  font-size:25px;
  margin:5px 0;
}

.subtitle{
  color:#666;
}

.card{
  background:white;
  border:1px solid #ddd;
  border-radius:20px;
  padding:18px;
  margin-top:15px;
}

.step{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.camera{
  display:block;
  width:100%;
  padding:20px 15px;
  border:2px dashed #aaa;
  border-radius:16px;
  background:#fcfbf9;
  text-align:center;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.camera input{
  display:none;
}

.preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin-top:12px;
  border-radius:15px;
}

.done{
  display:none;
  text-align:center;
  color:#555;
  margin-top:10px;
}

.btn{
  width:100%;
  border:0;
  border-radius:16px;
  background:#222;
  color:white;
  padding:17px;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.btn:disabled{
  opacity:.45;
}

#status{
  text-align:center;
  color:#666;
  margin-top:12px;
}

#result{
  display:none;
}

#result img{
  width:100%;
  border-radius:15px;
}

.error{
  color:#b00020 !important;
}

.note{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">👗</div>

  <h1>
    अपने ऊपर कपड़ा देखें
  </h1>

  <div class="subtitle">
    अपनी फोटो और कपड़े की फोटो लें
  </div>
</div>


<!-- PERSON -->

<div class="card">

<div class="step">
1. अपनी फोटो लें 📷
</div>

<label class="camera">

📷 कैमरा खोलें और अपनी फोटो लें

<input
  id="person"
  type="file"
  accept="image/*"
  capture="environment"
>

</label>

<img
  id="personPreview"
  class="preview"
>

<div
  id="personDone"
  class="done"
>
आपकी फोटो तैयार है ✅
</div>

</div>


<!-- CLOTH -->

<div class="card">

<div class="step">
2. कपड़े की फोटो लें 👗
</div>

<label class="camera">

👗 कैमरा खोलें और कपड़े की फोटो लें

<input
  id="cloth"
  type="file"
  accept="image/*"
  capture="environment"
>

</label>

<img
  id="clothPreview"
  class="preview"
>

<div
  id="clothDone"
  class="done"
>
कपड़े की फोटो तैयार है ✅
</div>

<p style="font-size:13px;color:#777">
कपड़े को सीधा रखें और पूरी डिजाइन फोटो में दिखाएं।
</p>

</div>


<!-- TRY -->

<div class="card">

<div class="step">
3. तैयार? ✨
</div>

<button
  id="try"
  class="btn"
  disabled
>
✨ अपने ऊपर देखें
</button>

<div id="status"></div>

</div>


<!-- RESULT -->

<div
  id="result"
  class="card"
>

<div class="step">
आपका AI Preview ✨
</div>

<img id="out">

</div>


<div class="note">
AI preview अनुमान के लिए है।
असली फिटिंग अलग हो सकती है।
</div>

</div>


<script type="module">

import {
  Client,
  handle_file
}
from
"https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";


const person =
document.getElementById("person");

const cloth =
document.getElementById("cloth");

const personPreview =
document.getElementById("personPreview");

const clothPreview =
document.getElementById("clothPreview");

const personDone =
document.getElementById("personDone");

const clothDone =
document.getElementById("clothDone");

const tryButton =
document.getElementById("try");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const output =
document.getElementById("out");


// PERSON PHOTO

person.addEventListener(
"change",
function(){

  const file =
  this.files[0];

  if(!file) return;

  personPreview.src =
  URL.createObjectURL(file);

  personPreview.style.display =
  "block";

  personDone.style.display =
  "block";

  status.innerText =
  "आपकी फोटो मिल गई ✅";

  checkReady();

});


// CLOTH PHOTO

cloth.addEventListener(
"change",
function(){

  const file =
  this.files[0];

  if(!file) return;

  clothPreview.src =
  URL.createObjectURL(file);

  clothPreview.style.display =
  "block";

  clothDone.style.display =
  "block";

  status.innerText =
  "कपड़े की फोटो मिल गई ✅";

  checkReady();

});


// CHECK

function checkReady(){

  if(
    person.files.length > 0 &&
    cloth.files.length > 0
  ){

    tryButton.disabled =
    false;

    status.innerText =
    "दोनों फोटो तैयार हैं ✅";

  }

}


// AI TRY ON

tryButton.addEventListener(
"click",
async function(){

  try{

    tryButton.disabled =
    true;

    status.classList.remove("error");

    status.innerText =
    "⏳ AI कपड़ा पहनाकर देख रहा है...";

    /*
      Public IDM-VTON Space.
      यह prototype/testing के लिए है.
    */

    const app =
    await Client.connect(
      "yisol/IDM-VTON"
    );


    const resultData =
    await app.predict(
      "/tryon",
      [

        {
          background:
          handle_file(
            person.files[0]
          ),

          layers:[],

          composite:null
        },

        handle_file(
          cloth.files[0]
        ),

        "upper body garment, suit or blouse",

        true,

        false,

        30,

        42
      ]
    );


    const generated =
    resultData.data[0];


    if(!generated){

      throw new Error(
        "AI image nahi mili"
      );

    }


    output.src =
    generated.url ||
    generated.path ||
    generated;


    result.style.display =
    "block";


    status.innerText =
    "✅ AI Preview तैयार है";


    result.scrollIntoView({
      behavior:"smooth"
    });


  }

  catch(error){

    console.error(error);

    status.classList.add(
      "error"
    );

    status.innerText =
    "❌ AI अभी busy है। थोड़ी देर बाद फिर कोशिश करें।";

  }

  finally{

    tryButton.disabled =
    false;

  }

});

</script>

</body>
</html>
